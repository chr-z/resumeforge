name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch vendored Pyodide runtime (core files)
        run: node scripts/fetch-pyodide.mjs
      - name: Install build deps
        run: npm install
      - name: Tests before publishing (native + WASM parity)
        run: |
          python3 -m unittest discover -s tests/python
          node --test tests/pyodide_engine.test.mjs
      - name: Stamp service worker cache version
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/__RF_CACHE_VERSION__/resumeforge-v2-${SHA}/" sw.js
          grep -o "resumeforge-v2-[a-f0-9]*" sw.js | head -1
      - name: Build (Vite)
        run: npm run build
      - name: Verify production bundle invariants
        run: |
          test -f dist/vendor/pyodide/pyodide.asm.wasm || { echo "missing pyodide.asm.wasm"; exit 1; }
          test -f dist/vendor/pyodide/python_stdlib.zip || { echo "missing python_stdlib.zip"; exit 1; }
          grep -q "__RF_RUNTIME_ASSETS__" dist/index.html || { echo "missing runtime asset list"; exit 1; }
      - name: PWA dist guard (stable manifest URL + SW stamp)
        run: node scripts/check-dist.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
